name: ci

# CI de codify-NG. Incluye las fitness functions que la constitución exige como
# enforcement ejecutable: dirección de dependencias (Principio I) y cero-egress
# en modo local (restricción de proyecto).

on:
  push:
    branches: [main]
  pull_request:
  # Lanzar la verificación **a mano**, sobre cualquier rama o commit.
  #
  # Sin esto, un commit solo se verifica si el evento que lo trajo llegó a encolarse. Durante
  # una caída de Actions eso no ocurre: el `push` a `main` se pierde, y ese commit ya no tiene
  # forma de verificarse — se quedaría esperando a que otro cambio lo arrastre de rebote, que
  # es justo cuando peor sirve para aislar un fallo. Pasó el 2026-08-06 con `71ac4bf`.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La piel Tauri enlaza contra el WebView del sistema; en Linux hay que proveerlo.
      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (incluye fitness functions de arquitectura y cero-egress)
        run: cargo test --workspace
