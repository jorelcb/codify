[workspace]
resolver = "2"
members = ["crates/codify-core", "crates/codify-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "2"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
