<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codify</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Controles de la sesión. Región con nombre para lectores de pantalla (FR-027). -->
    <header class="bar" role="region" aria-label="" data-i18n-aria="a11y.toolbar_region">
      <span class="brand">codify</span>

      <input id="repo" type="text" spellcheck="false" data-i18n-attr="placeholder:session.repo_placeholder" />

      <!-- Sin `data-i18n`: alterna entre Iniciar y Cancelar, y lo decide `setRunning()`.
           Con dos dueños, un repintado a destiempo lo dejaría diciendo «Iniciar» con la
           sesión en curso — y pulsarlo la cancelaría. -->
      <button id="action" class="primary"></button>

      <output id="state" class="state" data-state="idle" aria-live="polite"></output>

      <!-- Alcanzable en cualquier momento: es el contrapeso del flujo cronológico (FR-021). -->
      <button id="open-artifact" class="ghost" data-i18n="artifact.open" disabled></button>

      <!-- Indicador PERSISTENTE de modo: no depende del color, lleva texto (FR-005/FR-026). -->
      <span id="mode" class="mode-badge" data-mode="local" title="">
        <span class="glyph" aria-hidden="true">■</span>
        <!-- Sin `data-i18n`: lo pinta `renderMode()`, y dos dueños del mismo texto se pisan. -->
        <span id="mode-label"></span>
      </span>
    </header>

    <!-- Estado del proveedor de modelo: guía en vez de callar (FR-019). -->
    <section id="provider" class="provider" role="region" aria-label="" data-i18n-aria="a11y.provider_region">
      <h2 class="visually-hidden" data-i18n="provider.title"></h2>
      <span class="glyph" id="provider-glyph" aria-hidden="true">…</span>
      <!-- Sin `data-i18n`: lo pinta `provider.render()` a partir del último sondeo. -->
      <span id="provider-status"></span>
      <label class="inline">
        <span class="label" data-i18n="provider.model_label"></span>
        <select id="model" disabled></select>
      </label>
      <button id="provider-retry" class="ghost" data-i18n="provider.retry"></button>
      <p id="provider-next" class="next-step" hidden></p>
    </section>

    <!-- `003` — modo y proveedores conectados. `004` — con presentación propia: esto no es una
         barra de estado, es una zona con tres partes. El modo va primero a propósito: es lo que
         decide si algo puede salir del equipo, y verlo después de conectar sería tarde. -->
    <section id="conexiones" class="conexion" role="region" aria-label="" data-i18n-aria="a11y.connections_region">
      <!-- El grupo del modo se nombra **desde su propio encabezado**, no desde una clave aparte:
           dos copias del mismo texto es justo lo que este spec vino a quitar. -->
      <div class="modo" role="group" aria-labelledby="modo-titulo">
        <h2 id="modo-titulo" class="conexion-titulo" data-i18n="mode.title"></h2>
        <label class="inline">
          <input type="checkbox" id="modo-local" checked />
          <span class="label" data-i18n="mode.local_option"></span>
        </label>
        <p id="modo-aviso" class="next-step" hidden data-i18n="mode.changed"></p>
        <p id="modo-receptores" class="next-step" hidden data-i18n="mode.will_receive"></p>
      </div>

      <div class="cuentas">
        <h3 class="conexion-titulo" data-i18n="connection.title"></h3>
        <ul id="conexiones-lista"></ul>
        <p id="conexiones-vacio" data-i18n="connection.none"></p>
      </div>

      <!-- FR-002a: plegado por defecto. Sin cuentas conectadas —el caso común— tres campos
           vacíos permanentes hacen que el caso común pague por el raro. -->
      <details class="alta">
        <summary data-i18n="connection.add"></summary>
        <div class="alta-campos">
          <label class="campo">
            <span class="label" data-i18n="connection.label_field"></span>
            <input type="text" id="conn-label" />
          </label>
          <label class="campo">
            <span class="label" data-i18n="connection.endpoint_field"></span>
            <input type="text" id="conn-endpoint" />
          </label>
          <label class="campo">
            <span class="label" data-i18n="connection.tier_field"></span>
            <select id="conn-tier">
              <option value="cheap" data-i18n="connection.tier_cheap"></option>
              <option value="heavy" data-i18n="connection.tier_heavy"></option>
            </select>
          </label>
        </div>
        <button id="conectar" class="ghost" data-i18n="connection.submit"></button>

        <div id="desafio" hidden>
          <p id="desafio-codigo" class="next-step" data-i18n="connection.code_hint"></p>
          <p id="desafio-credencial" class="next-step" data-i18n="connection.secret_hint"></p>
          <p id="desafio-sin-almacen" class="next-step" hidden data-i18n="connection.no_store"></p>
        </div>
      </details>
    </section>

    <!-- La corriente cronológica de bloques (FR-020). aria-live para que un lector de
         pantalla anuncie lo que va llegando sin que el usuario tenga que ir a buscarlo. -->
    <main id="stream" class="stream" role="log" aria-live="polite" aria-label="" data-i18n-aria="a11y.stream_region">
      <p class="hint" data-i18n="stream.hint"></p>
    </main>

    <!-- Panel de decisión (FR-010/FR-012/FR-014). Vive FUERA de la corriente a propósito:
         la corriente es append-only y registra qué pasó; esto es lo que está esperando a una
         persona ahora mismo, y cambia. Mezclarlos obligaría a reescribir bloques ya emitidos. -->
    <section id="decide" class="decide" role="region" aria-label="" data-i18n-aria="a11y.decide_region" hidden>
      <header class="decide-head">
        <h2 data-i18n="proposal.title"></h2>
        <span id="decide-count" class="decide-count"></span>
        <button id="decide-prev" class="ghost" data-i18n="proposal.prev"></button>
        <button id="decide-next" class="ghost" data-i18n="proposal.next"></button>
      </header>
      <p id="decide-target" class="decide-target"></p>
      <p id="decide-rationale" class="decide-rationale"></p>
      <!-- El diff se muestra tal cual: es lo que la persona lee para decidir. -->
      <pre id="decide-diff" class="diff" tabindex="0"></pre>
      <div id="decide-editor" class="decide-editor" hidden>
        <label class="label" for="decide-text" data-i18n="proposal.edit_hint"></label>
        <textarea id="decide-text" rows="6"></textarea>
      </div>
      <div class="dialog-actions">
        <button id="decide-reject" class="ghost" data-i18n="proposal.reject"></button>
        <button id="decide-edit" class="ghost" data-i18n="proposal.edit"></button>
        <button id="decide-approve" class="primary" data-i18n="proposal.approve"></button>
      </div>
    </section>

    <!-- Lo que se aplicó SIN preguntar (FR-008). Si el producto se permite no consultar por
         lo de bajo riesgo, el precio es que deshacerlo esté a mano — no en un menú. -->
    <section id="applied" class="applied" role="region" aria-label="" data-i18n-aria="a11y.applied_region" hidden>
      <h2 data-i18n="proposal.applied_title"></h2>
      <ul id="applied-list" class="applied-list"></ul>
    </section>

    <!-- Refinamiento conversacional (FR-010): una caja de texto, no una cola de preguntas. -->
    <form id="composer" class="composer">
      <input id="message" type="text" data-i18n-attr="placeholder:refine.placeholder" disabled />
      <button id="send" type="submit" class="primary" data-i18n="refine.send" disabled></button>
    </form>

    <!-- Preferencias: los dos idiomas son independientes y se ve que lo son (FR-016/016b). -->
    <footer class="prefs" role="region" aria-label="" data-i18n-aria="a11y.prefs_region">
      <label class="inline">
        <span class="label" data-i18n="locale.ui_label"></span>
        <select id="ui-locale">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="inline">
        <span class="label" data-i18n="locale.artifacts_label"></span>
        <select id="artifact-locale">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </label>
      <span class="hint-inline" data-i18n="locale.independent_hint"></span>
      <span class="hint-inline shortcuts" data-i18n="a11y.shortcuts"></span>
    </footer>

    <!-- Artefacto completo, con su fundamento a la vista (FR-021, FR-011 a FR-013).
         Es un diálogo modal para que el foco quede atrapado dentro y Escape lo cierre. -->
    <dialog id="artifact-dialog" class="artifact" aria-labelledby="artifact-title"
            role="region" aria-label="" data-i18n-aria="a11y.artifact_region">
      <header class="artifact-head">
        <h2 id="artifact-title" data-i18n="artifact.title"></h2>
        <label class="inline">
          <span class="label" data-i18n="artifact.select_label"></span>
          <select id="artifact-path"></select>
        </label>
        <!-- Un archivo en pantalla no es un archivo en el repositorio (FR-017). -->
        <span id="artifact-write-state" class="write-state"></span>
        <button id="artifact-close" class="ghost" data-i18n="artifact.close"></button>
      </header>
      <p id="artifact-empty" class="hint" data-i18n="artifact.empty" hidden></p>
      <div id="artifact-body" class="artifact-body"></div>
    </dialog>

    <!-- Cierre con puntos sin verificar y sin atender (FR-014). -->
    <dialog id="tentative-dialog" aria-labelledby="tentative-title">
      <h2 id="tentative-title" data-i18n="close.tentative_title"></h2>
      <p><strong id="tentative-count"></strong> <span data-i18n="artifact.tentative"></span></p>
      <p data-i18n="close.tentative_warning"></p>
      <div class="dialog-actions">
        <button id="tentative-review" class="primary" data-i18n="close.review"></button>
        <button id="tentative-confirm" class="ghost" data-i18n="close.confirm"></button>
      </div>
    </dialog>

    <!-- Confirmación antes de cerrar con trabajo en curso (FR-024). -->
    <dialog id="close-dialog" aria-labelledby="close-title">
      <h2 id="close-title" data-i18n="close.title"></h2>
      <p data-i18n="close.warning"></p>
      <div class="dialog-actions">
        <button id="close-cancel" class="ghost" data-i18n="close.cancel"></button>
        <button id="close-confirm" class="primary" data-i18n="close.confirm"></button>
      </div>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
