[package]
name = "codify-app"
description = "Piel de escritorio de codify-NG. Linkea codify-core in-process; renderiza y captura decisiones."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "codify_app"
# Solo `rlib`: el binario enlaza la biblioteca en el mismo proceso. `staticlib` y `cdylib`
# son el default de la plantilla de Tauri **para móvil** y aquí solo generan artefactos
# gigantes que nadie consume.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codify-core = { path = "../codify-core" }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
